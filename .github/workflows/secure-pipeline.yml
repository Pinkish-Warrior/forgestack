name: Secure Pipeline

# Build -> SAST + secrets scan -> deploy. Day 8 of the plan: sast and
# secrets-scan run against source in parallel with build, and deploy now
# depends on both — a finding in either blocks deploy via the job's default
# failure propagation. Still to come:
#   Day 9  — Trivy (dependency + container scan) + CodeQL
#   Day 10 — Cosign (image signing) + a formal policy gate: deploy only
#            runs if every scan job passed and nothing high/critical was found
# secure-app requires SECRET_KEY at runtime (fails closed if unset) — the
# deploy step below passes a throwaway CI value, not a real secret.

on:
  push:
    branches: [main]
    paths:
      - "applications/secure-app/**"
      - ".github/workflows/secure-pipeline.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          docker build \
            -t secure-app:${{ github.sha }} \
            applications/secure-app

      - name: Save image
        run: docker save secure-app:${{ github.sha }} -o secure-app.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: secure-app-image
          path: secure-app.tar
          retention-days: 1

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config security/semgrep/semgrep-rules.yaml \
            --config p/security-audit \
            --error \
            applications/secure-app

  secrets-scan:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Days 9-10 add Trivy/CodeQL/Cosign jobs here. Once they exist,
  # `deploy.needs` below becomes the full list so a failing scan blocks
  # deploy — Day 10 turns this into a formal policy gate.
  deploy:
    name: Deploy
    needs: [build, sast, secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: secure-app-image

      - name: Load image
        run: docker load -i secure-app.tar

      - name: Deploy
        run: |
          docker run -d --name secure-app -p 5000:5000 \
            -e SECRET_KEY=ci-smoke-test-key \
            secure-app:${{ github.sha }}

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -sf -X POST http://localhost:5000/register \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"smoke-$i\",\"password\":\"smoke-pass\"}"; then
              echo "app is up and serving traffic"
              exit 0
            fi
            sleep 2
          done
          echo "app never came up" >&2
          exit 1

      - name: Report
        if: always()
        run: docker logs secure-app || true
