name: Secure Pipeline

# Build -> push to GHCR -> SAST + secrets scan + dependency/container scan
# + CodeQL -> sign (Cosign, keyless) -> verify (policy gate) -> deploy.
# Day 10 completes Phase 2: `sign` only runs once every scan job below has
# passed (needs-based blocking, same as Days 8-9); `gate` then
# cryptographically verifies that signature before `deploy` is allowed to
# pull and run the image. A valid signature is proof the image cleared
# every gate, not just a checkbox — see security/cosign/cosign-policy.yaml.
# secure-app requires SECRET_KEY at runtime (fails closed if unset) — the
# deploy step below passes a throwaway CI value, not a real secret.

on:
  push:
    branches: [main]
    paths:
      - "applications/secure-app/**"
      - ".github/workflows/secure-pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "applications/secure-app/**"
      - ".github/workflows/secure-pipeline.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image-name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name (GHCR requires lowercase)
        id: image-name
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/secure-app" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          docker build \
            -t secure-app:${{ github.sha }} \
            -t ${{ steps.image-name.outputs.image }}:${{ github.sha }} \
            applications/secure-app

      - name: Save image (for container-scan)
        run: docker save secure-app:${{ github.sha }} -o secure-app.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: secure-app-image
          path: secure-app.tar
          retention-days: 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        run: |
          docker push ${{ steps.image-name.outputs.image }}:${{ github.sha }} | tee push.log
          digest=$(grep -oP 'digest: \Ksha256:[a-f0-9]+' push.log)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config security/semgrep/semgrep-rules.yaml \
            --config p/security-audit \
            --error \
            applications/secure-app

  secrets-scan:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: applications/secure-app
          trivy-config: security/trivy/trivy-config.yaml

  container-scan:
    name: Container scan (Trivy)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: secure-app-image

      - name: Load image
        run: docker load -i secure-app.tar

      - name: Run Trivy (image)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: image
          image-ref: secure-app:${{ github.sha }}
          trivy-config: security/trivy/trivy-config.yaml

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          config-file: security/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  sign:
    name: Sign image (Cosign)
    needs: [build, sast, secrets-scan, dependency-scan, container-scan, codeql]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image (keyless)
        run: |
          cosign sign --yes \
            ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}

  # The formal policy gate: cryptographic proof, not just job-success
  # propagation. Policy documented in security/cosign/cosign-policy.yaml.
  gate:
    name: Policy gate (verify signature)
    needs: [build, sign]
    runs-on: ubuntu-latest
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/secure-pipeline\.yml@refs/.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}

  deploy:
    name: Deploy
    needs: [build, gate]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull verified image
        run: docker pull ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}

      - name: Deploy
        run: |
          docker run -d --name secure-app -p 5000:5000 \
            -e SECRET_KEY=ci-smoke-test-key \
            ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -sf -X POST http://localhost:5000/register \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"smoke-$i\",\"password\":\"smoke-pass\"}"; then
              echo "app is up and serving traffic"
              exit 0
            fi
            sleep 2
          done
          echo "app never came up" >&2
          exit 1

      - name: Report
        if: always()
        run: docker logs secure-app || true
