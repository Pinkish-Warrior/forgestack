name: Secure Pipeline

# Skeleton (Phase 2, Day 7): build stage + deploy stage only, using an
# artifact hand-off so no registry credentials are needed yet. The gap
# between build and deploy is where the gates go in:
#   Day 8  — Semgrep (SAST) + secrets scan
#   Day 9  — Trivy (dependency + container scan) + CodeQL
#   Day 10 — Cosign (image signing) + policy gate: deploy only runs if
#            every scan job above passed and nothing high/critical was found
# secure-app requires SECRET_KEY at runtime (fails closed if unset) — the
# deploy step below passes a throwaway CI value, not a real secret.

on:
  push:
    branches: [main]
    paths:
      - "applications/secure-app/**"
      - ".github/workflows/secure-pipeline.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          docker build \
            -t secure-app:${{ github.sha }} \
            applications/secure-app

      - name: Save image
        run: docker save secure-app:${{ github.sha }} -o secure-app.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: secure-app-image
          path: secure-app.tar
          retention-days: 1

  # Days 8-10 add scan jobs here, each with `needs: build`. Once they
  # exist, `deploy.needs` below becomes the full list so a failing scan
  # blocks deploy.
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: secure-app-image

      - name: Load image
        run: docker load -i secure-app.tar

      - name: Deploy
        run: |
          docker run -d --name secure-app -p 5000:5000 \
            -e SECRET_KEY=ci-smoke-test-key \
            secure-app:${{ github.sha }}

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -sf -X POST http://localhost:5000/register \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"smoke-$i\",\"password\":\"smoke-pass\"}"; then
              echo "app is up and serving traffic"
              exit 0
            fi
            sleep 2
          done
          echo "app never came up" >&2
          exit 1

      - name: Report
        if: always()
        run: docker logs secure-app || true
