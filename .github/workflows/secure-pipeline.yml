name: Secure Pipeline

# Build -> push to GHCR -> SAST + secrets scan + dependency/container scan
# + CodeQL -> sign (Cosign, keyless) -> verify (policy gate) -> deploy.
# Day 10 completes Phase 2: `sign` only runs once every scan job below has
# passed (needs-based blocking, same as Days 8-9); `gate` then
# cryptographically verifies that signature before `deploy` is allowed to
# pull and run the image. A valid signature is proof the image cleared
# every gate, not just a checkbox — see security/cosign/cosign-policy.yaml.
# secure-app requires SECRET_KEY at runtime (fails closed if unset) — the
# deploy step below passes a throwaway CI value, not a real secret.
#
# Gotcha: required status checks are only satisfied by check suites born
# from THIS workflow's own `pull_request` event on a given commit — a
# `workflow_dispatch` run against the same SHA reports success but never
# attaches to the PR's merge gate. A PR that doesn't touch a path below
# can never trigger a real run, so it can never merge. Hit this twice
# (PR #4, then again wiring in the Day 14 docs) before fixing it properly:
# docs/**, README.md, and pipelines/** are now included below specifically
# so a docs-only PR triggers a real run and can merge without a throwaway
# workflow-file edit. Costs a few extra CI minutes on doc-only changes;
# worth it since this recurs on every doc-only PR otherwise.

on:
  push:
    branches: [main]
    paths:
      - "applications/secure-app/**"
      - ".github/workflows/secure-pipeline.yml"
      - "docs/**"
      - "README.md"
      - "pipelines/**"
  pull_request:
    branches: [main]
    paths:
      - "applications/secure-app/**"
      - ".github/workflows/secure-pipeline.yml"
      - "docs/**"
      - "README.md"
      - "pipelines/**"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image-name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name (GHCR requires lowercase)
        id: image-name
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/secure-app" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          docker build \
            -t secure-app:${{ github.sha }} \
            -t ${{ steps.image-name.outputs.image }}:${{ github.sha }} \
            applications/secure-app

      - name: Save image (for container-scan)
        run: docker save secure-app:${{ github.sha }} -o secure-app.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: secure-app-image
          path: secure-app.tar
          retention-days: 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        run: |
          docker push ${{ steps.image-name.outputs.image }}:${{ github.sha }} | tee push.log
          digest=$(grep -oP 'digest: \Ksha256:[a-f0-9]+' push.log)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config security/semgrep/semgrep-rules.yaml \
            --config p/security-audit \
            --error \
            applications/secure-app

      # Day 13: separate, non-blocking SARIF run for the findings report.
      # Kept as a second invocation rather than reusing the gate step's
      # output so the gate step above stays untouched -- lower risk to a
      # required check than trying to make one run serve both purposes.
      - name: Generate Semgrep SARIF
        if: always()
        run: |
          semgrep scan \
            --config security/semgrep/semgrep-rules.yaml \
            --config p/security-audit \
            --sarif --output=semgrep-results.sarif \
            applications/secure-app

      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results.sarif
          path: semgrep-results.sarif
          retention-days: 30

  secrets-scan:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action already uploads a SARIF artifact named
      # "gitleaks-results.sarif" by default (verified 2026-08-09 against a
      # real run) -- no extra step needed for Day 13's findings report.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: applications/secure-app
          trivy-config: security/trivy/trivy-config.yaml

      # Day 13: same scan, SARIF output, exit-code forced to 0 -- gating
      # already happened in the step above via trivy-config.yaml's
      # exit-code: 1. This one only feeds the findings report.
      - name: Generate Trivy SARIF (filesystem)
        if: always()
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: applications/secure-app
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy SARIF (filesystem)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-results.sarif
          path: trivy-fs-results.sarif
          retention-days: 30

  container-scan:
    name: Container scan (Trivy)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: secure-app-image

      - name: Load image
        run: docker load -i secure-app.tar

      - name: Run Trivy (image)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: image
          image-ref: secure-app:${{ github.sha }}
          trivy-config: security/trivy/trivy-config.yaml

      - name: Generate Trivy SARIF (image)
        if: always()
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: image
          image-ref: secure-app:${{ github.sha }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy SARIF (image)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-results.sarif
          path: trivy-image-results.sarif
          retention-days: 30

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          config-file: security/codeql/codeql-config.yml

      # `output:` also writes the SARIF locally (as <language>.sarif)
      # in addition to the default upload to code scanning -- needed so
      # Day 13's findings report has a file to read, since the alert data
      # otherwise only lives in GitHub's code-scanning UI.
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results

      - name: Upload CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results.sarif
          path: codeql-results/*.sarif
          retention-days: 30

  # Day 13: merges every scan job's SARIF into one human-readable report.
  # `if: always()` on both the job and its needs means this still runs
  # (and is most useful) even when a scan job above failed -- a findings
  # report that only appears on a clean run defeats the point.
  # Deliberately not a required check: this reports on findings, it
  # doesn't gate on them -- the 10 existing required checks are the gate.
  findings-report:
    name: Findings report
    needs: [sast, secrets-scan, dependency-scan, container-scan, codeql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all SARIF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-results.sarif"
          path: sarif

      - name: Generate report
        run: |
          find_sarif() {
            find "sarif/$1" -type f -name '*.sarif' 2>/dev/null | head -1
          }

          python3 security/reports/generate_findings_report.py \
            --output reports/findings-report.md \
            --input "SAST (Semgrep)=$(find_sarif semgrep-results.sarif)" \
            --input "SAST (CodeQL)=$(find_sarif codeql-results.sarif)" \
            --input "Secrets scan (Gitleaks)=$(find_sarif gitleaks-results.sarif)" \
            --input "Dependency scan (Trivy)=$(find_sarif trivy-fs-results.sarif)" \
            --input "Container scan (Trivy)=$(find_sarif trivy-image-results.sarif)"

          cat reports/findings-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload findings report
        uses: actions/upload-artifact@v4
        with:
          name: findings-report
          path: reports/findings-report.md
          retention-days: 30

  sign:
    name: Sign image (Cosign)
    needs: [build, sast, secrets-scan, dependency-scan, container-scan, codeql]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image (keyless)
        run: |
          cosign sign --yes \
            ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}

  # The formal policy gate: cryptographic proof, not just job-success
  # propagation. Policy documented in security/cosign/cosign-policy.yaml.
  gate:
    name: Policy gate (verify signature)
    needs: [build, sign]
    runs-on: ubuntu-latest
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify signature
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/secure-pipeline\.yml@refs/.*$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}

  deploy:
    name: Deploy
    needs: [build, gate]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull verified image
        run: docker pull ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}

      - name: Deploy
        run: |
          docker run -d --name secure-app -p 5000:5000 \
            -e SECRET_KEY=ci-smoke-test-key \
            ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -sf -X POST http://localhost:5000/register \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"smoke-$i\",\"password\":\"smoke-pass\"}"; then
              echo "app is up and serving traffic"
              exit 0
            fi
            sleep 2
          done
          echo "app never came up" >&2
          exit 1

      - name: Report
        if: always()
        run: docker logs secure-app || true
