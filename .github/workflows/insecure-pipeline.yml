name: Insecure Pipeline

# Deliberately bare: build -> deploy, no scanning, no gate. This is the
# "before" side of the contrast the repo demonstrates — every flaw in
# vulnerable-app (see applications/vulnerable-app/README.md) ships untouched
# because nothing here looks for it. Compare against secure-pipeline.yml.

on:
  push:
    branches: [main]
    paths:
      - "applications/vulnerable-app/**"
      - ".github/workflows/insecure-pipeline.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          docker build \
            -t vulnerable-app:${{ github.sha }} \
            applications/vulnerable-app

      - name: Deploy
        run: |
          docker run -d --name vulnerable-app -p 5000:5000 vulnerable-app:${{ github.sha }}

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -sf -X POST http://localhost:5000/register \
              -H "Content-Type: application/json" \
              -d "{\"username\":\"smoke-$i\",\"password\":\"smoke-pass\"}"; then
              echo "app is up and serving traffic"
              exit 0
            fi
            sleep 2
          done
          echo "app never came up" >&2
          exit 1

      - name: Report
        if: always()
        run: docker logs vulnerable-app || true
